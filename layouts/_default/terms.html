{{ define "main" }}

<!-- =================================================================
     STYLE BLOCK (样式表)
     我们将 CSS 直接写在这里，确保样式绝对生效
     ================================================================= -->
<style>
    /* 1. 全局设定 - 移除强制背景，使其融入 Hugo 主题 */
    .hacker-page-wrapper {
        /* 修改：背景透明，跟随系统/主题默认颜色 */
        background-color: transparent; 
        /* 修改：移除全局文字颜色，只在终端内部强制亮色 */
        /* color: #e0e0e0; */ 
        min-height: 80vh; /* 稍微减小最小高度，避免在某些布局下撑太长 */
        padding: 20px;
        /* 仍然保留字体设定，确保等宽字体 */
        font-family: 'Fira Code', 'Consolas', 'Monaco', 'Courier New', monospace;
    }

    /* 2. 终端容器 - 保持黑底和发光边框 */
    .hacker-terminal-container {
        max-width: 900px;
        margin: 40px auto;
        /* 核心：终端内部保持深色背景 */
        background: #111; 
        color: #e0e0e0; /* 核心：强制终端内部文字为亮色 */
        border: 1px solid #333;
        border-radius: 8px;
        /* 外部辉光，增加立体感 */
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.2), 0 20px 50px rgba(0,0,0,0.4);
        font-family: 'Fira Code', 'Consolas', 'Monaco', 'Courier New', monospace;
        overflow: hidden;
        line-height: 1.5;
        position: relative;
        z-index: 1;
        text-align: left; /* 强制左对齐内容 */
    }

    /* --- CRT 扫描线特效层 --- */
    /* 仅限制在 terminal container 内部，无需修改，因为 position absolute 是相对于 container 的 */
    .hacker-terminal-container::before {
        content: " ";
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        background: linear-gradient(
            to bottom,
            rgba(18, 16, 16, 0) 50%,
            rgba(0, 0, 0, 0.25) 50%
        );
        background-size: 100% 4px; /* 扫描线密度 */
        z-index: 999;
        pointer-events: none;
        opacity: 0.6;
    }

    /* 3. 终端顶部栏 */
    .terminal-header {
        background: #1f1f1f;
        border-bottom: 1px solid #2b2b2b;
        display: flex; 
        align-items: center;
        padding: 10px 15px;
        position: relative;
        z-index: 2;
        height: 40px; 
        box-sizing: border-box;
    }

    .terminal-buttons {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-right: auto; 
    }

    /* 拟物化按钮 */
    .terminal-buttons .btn {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        display: block;
        flex-shrink: 0; 
    }
    .btn.red { background: #ff5f56; box-shadow: 0 0 5px #ff5f56; }
    .btn.yellow { background: #ffbd2e; box-shadow: 0 0 5px #ffbd2e; }
    .btn.green { background: #27c93f; box-shadow: 0 0 5px #27c93f; }

    /* 4. 终端内容区 */
    .terminal-body {
        background-color: #0c0c0c;
        color: #ccc;
        text-shadow: 0 0 1px rgba(255, 255, 255, 0.1); 
        min-height: 500px;
        padding: 30px;
        position: relative;
        overflow-x: auto; /* 允许横向滚动 */
    }

    /* 命令行提示符 */
    .command-line {
        margin-bottom: 20px;
        font-size: 1rem;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
    }

    .prompt-user { color: #00d7ff; font-weight: bold; }
    .prompt-at { color: #fff; }
    .prompt-host { color: #00d7ff; font-weight: bold; }
    .prompt-colon { color: #fff; }
    .prompt-path { color: #af87ff; font-weight: bold; }
    .prompt-char { color: #fff; font-weight: bold; margin-right: 8px; }
    .cmd { color: #a6e22e; font-weight: bold; }

    /* 5. 列表风格 */
    .hacker-list {
        list-style: none;
        padding: 0;
        margin: 0;
        font-size: 0.95rem;
    }

    .list-item {
        display: grid;
        /* 定义列宽：权限(100px) 硬链接(30px) 用户(80px) 组(80px) 大小(80px) 剩余空间(自动) */
        grid-template-columns: 100px 30px 80px 80px 80px 1fr; 
        gap: 15px;
        padding: 4px 10px;
        align-items: center;
        border-radius: 2px;
        white-space: nowrap; /* 核心：强制不换行 */
    }

    .list-item:hover {
        background-color: rgba(255, 255, 255, 0.1);
        cursor: pointer;
    }

    /* 颜色定义 */
    .col-perm { color: #e6db74; }
    .col-link-count { color: #66d9ef; text-align: right; }
    .col-user { color: #f92672; }
    .col-group { color: #f92672; }
    .col-size { color: #ae81ff; text-align: right; font-family: monospace;} 
    
    .col-name {
        white-space: nowrap;
    }
    
    .name-link {
        color: #66d9ef;
        font-weight: bold;
        text-decoration: none;
        transition: all 0.2s;
        text-shadow: 0 0 2px rgba(102, 217, 239, 0.4);
    }

    .name-link:hover {
        color: #fff;
        text-shadow: 0 0 8px rgba(102, 217, 239, 0.8);
        text-decoration: underline;
    }

    /* Total 行对齐修正 */
    .total-line {
        color: #888;
        margin-bottom: 5px;
        padding-left: 10px; /* 与 .list-item 的 padding 保持一致 */
        font-family: inherit;
    }

    .cursor {
        display: inline-block;
        width: 8px;
        height: 1.2em;
        background-color: #ccc;
        vertical-align: sub;
        animation: blink 1s step-end infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    /* 滚动条样式 */
    .terminal-body::-webkit-scrollbar { height: 8px; width: 8px; }
    .terminal-body::-webkit-scrollbar-track { background: #0c0c0c; }
    .terminal-body::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    
    /* 移动端适配 */
    @media (max-width: 768px) {
        .hacker-terminal-container { margin: 10px; }
        .terminal-body { padding: 15px; }
        
        /* 手机上为了不破坏布局，依然保持 Grid，但允许横向滚动 */
        .list-item {
            font-size: 0.9rem;
        }
    }
</style>

<!-- =================================================================
     HTML STRUCTURE (页面结构)
     ================================================================= -->
<div class="hacker-page-wrapper"> <!-- 增加一层 wrapper 确保背景色生效 -->
    <div class="hacker-terminal-container">
        
        <!-- 终端头部 -->
        <div class="terminal-header">
            <div class="terminal-buttons">
                <div class="btn red" title="Close"></div>
                <div class="btn yellow" title="Minimize"></div>
                <div class="btn green" title="Maximize"></div>
            </div>
            <div class="terminal-title"></div>
        </div>

        <!-- 终端内容区 -->
        <div class="terminal-body">
            
            <!-- 命令行模拟 -->
            <div class="command-line">
                <span class="prompt-user">Enil</span><span class="prompt-at">@</span><span class="prompt-host">enilmalus</span>
                <span class="prompt-colon">:</span>
                <span class="prompt-path">/var/www/tags</span>
                <span class="prompt-char">#</span>
                <span class="cmd">ls -liah</span>
            </div>

            <!-- Total 行 -->
            <div class="total-line">total {{ len .Data.Terms }} directories</div>

            <ul class="hacker-list">
                <!-- 循环输出标签 -->
                {{ range .Data.Terms.ByCount }}
                <li class="list-item">
                    <span class="col-perm">drwxr-xr-x</span>
                    <span class="col-link-count">2</span>
                    <span class="col-user">enil</span>
                    <span class="col-group">enil</span>
                    <span class="col-size">{{ .Count }}</span>
                    <div class="col-name">
                        <a href="{{ .Page.Permalink }}" class="name-link">{{ .Page.Title }}</a>
                    </div>
                </li>
                {{ end }}
            </ul>
            
            <!-- 底部 Prompt -->
            <div class="command-line footer-cmd" style="margin-top: 20px;">
                <span class="prompt-user">Enil</span><span class="prompt-at">@</span><span class="prompt-host">enilmalus</span>
                <span class="prompt-colon">:</span>
                <span class="prompt-path">/var/www/tags</span>
                <span class="prompt-char">#</span>
                <span class="cursor">_</span>
            </div>
        </div>
    </div>
</div>
{{ end }}
