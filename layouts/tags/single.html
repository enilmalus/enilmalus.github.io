{{ define "main" }}
<main>
    <div class="post">
        <h1>标签：{{ .Title }}</h1>
        <p style="color: #666; margin-bottom: 30px;">
            共有 {{ len .Pages }} 篇文章使用了这个标签
        </p>
        
        <div class="posts">
            {{ range .Pages }}
                <div style="margin: 20px 0; padding: 20px; border: 1px solid #eee; border-radius: 8px;">
                    <h2 style="margin: 0 0 10px 0;">
                        <a href="{{ .RelPermalink }}" style="color: #333; text-decoration: none;">
                            {{ .Title }}
                        </a>
                    </h2>
                    <div style="color: #999; font-size: 14px; margin-bottom: 15px;">
                        发布于 {{ .Date.Format "2006年01月02日" }}
                    </div>
                    <div style="color: #666;">
                        {{ .Summary }}
                    </div>
                    {{ if .Params.tags }}
                        <div style="margin-top: 15px;">
                            {{ range .Params.tags }}
                                <span style="background: #f0f0f0; padding: 4px 8px; border-radius: 12px; 
                                           font-size: 12px; margin-right: 8px; color: #666;">
                                    {{ . }}
                                </span>
                            {{ end }}
                        </div>
                    {{ end }}
                </div>
            {{ end }}
        </div>
        
        <div style="text-align: center; margin-top: 40px;">
            <a href="/tags/" style="color: #007acc; text-decoration: none;">
                ← 返回所有标签
            </a>
        </div>
    </div>
</main>
{{ end }}
